<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Premiere Pro Clone - AI Powered</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">Adobe <span style="color: #fff; font-weight: normal;">Premiere Pro Replica</span></div>
        <div class="actions">
            <button id="import-btn"><i class="fas fa-file-import"></i> Import</button>
            <button id="export-btn" class="primary-btn"><i class="fas fa-file-export"></i> Export</button>
        </div>
    </header>

    <main class="main-content">
        <section class="left-panel">
            <div class="tabs">
                <button class="tab active" data-tab="media">Media</button>
                <button class="tab" data-tab="templates">Templates</button>
                <button class="tab" data-tab="titles">Titles</button>
                <button class="tab" data-tab="audio">Audio</button>
                <button class="tab" data-tab="effects">Effects</button>
                <button class="tab" data-tab="transitions">Transitions</button>
            </div>

            <div id="media-library" class="library-container">
                <div class="search-box">
                    <input type="text" id="search-media" placeholder="Search project assets...">
                </div>
                <div id="media-grid" class="media-grid"></div>
            </div>

            <div id="templates-panel" class="library-container" style="display: none;">
                <h3>Templates</h3>
                <div id="templates-grid" class="media-grid"></div>
            </div>

            <div id="titles-panel" class="library-container" style="display: none;">
                <h3>Titles</h3>
                <div class="input-group">
                    <label>Overlay Text</label>
                    <input type="text" id="title-text" placeholder="Enter text...">
                </div>
                <button id="add-title-btn" class="primary-btn" style="width: 100%; margin-top: 10px;">Add Title</button>
            </div>

            <div id="audio-panel" class="library-container" style="display: none;">
                <h3>Audio</h3>
                <div id="audio-list" class="media-grid"></div>
            </div>

            <div id="effects-panel" class="library-container" style="display: none;">
                <h3>Effects</h3>
                <div id="effects-grid" class="media-grid"></div>
            </div>

            <div id="transitions-panel" class="library-container" style="display: none;">
                <h3>Transitions</h3>
                <div id="transitions-grid" class="media-grid"></div>
            </div>
        </section>

        <section class="preview-panel">
            <div class="monitors-container">
                <div class="monitor" id="source-monitor">
                    <div class="monitor-header">Source: (no clip)</div>
                    <div class="preview-container">
                        <video id="source-video" controls style="display: none;"></video>
                        <div id="source-placeholder" style="color: #555;">Source Monitor</div>
                    </div>
                </div>
                <div class="monitor" id="program-monitor">
                    <div class="monitor-header">Program: Sequence 01</div>
                    <div class="preview-container" id="main-preview-container">
                        <div id="adobe-text-overlay">
                            <input type="text" id="adobe-text-editor" placeholder="Type here..." spellcheck="false">
                        </div>
                        <canvas id="preview-canvas"></canvas>
                    </div>
                    <div class="preview-controls">
                        <button id="prev-frame"><i class="fas fa-step-backward"></i></button>
                        <button id="play-pause"><i class="fas fa-play"></i></button>
                        <button id="next-frame"><i class="fas fa-step-forward"></i></button>
                        <span id="timestamp" style="font-family: monospace; font-size: 11px; margin-left: 10px;">00:00:00:00</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="timeline-area">
        <div class="timeline-header">
            <div class="editing-tools">
                <div class="tool-btn active" id="tool-select" title="Selection Tool (V)"><i class="fas fa-mouse-pointer"></i></div>
                <div class="tool-btn" id="tool-razor" title="Razor Tool (C)"><i class="fas fa-cut"></i></div>
            </div>
            <div class="timeline-toolbar" style="flex: 1; display: flex; align-items: center; padding: 0 10px;">
                <span style="font-size: 11px; color: #AAA;">Sequence 01</span>
                <div style="flex: 1;"></div>
                <input type="range" id="timeline-zoom" min="0.1" max="5" step="0.1" value="1" style="width: 100px;">
            </div>
        </div>
        <div class="timeline-main">
            <div class="timeline-content" id="timeline">
                <div id="playhead"></div>
                <div class="track" id="video-track-2" data-type="V2"></div>
                <div class="track" id="video-track-1" data-type="V1"></div>
                <div class="track" id="audio-track" data-type="A1"></div>
            </div>
        </div>
    </footer>

    <!-- AI Agent UI -->
    <div id="ai-trigger" title="AI Assistant">
        <i class="fas fa-robot"></i>
    </div>

    <div id="ai-panel" style="display: none;">
        <div class="monitor-header" style="display: flex; justify-content: space-between; align-items: center;">
            <span>AI Editor Assistant</span>
            <button id="close-ai" style="background: none; border: none; color: white; cursor: pointer;"><i class="fas fa-times"></i></button>
        </div>
        <div id="ai-chat-history" style="flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 10px;">
            <div class="bot-msg" style="background: #333; padding: 8px; border-radius: 4px;">Ready to edit. How can I help?</div>
        </div>
        <div style="padding: 10px; border-top: 1px solid #444; display: flex; gap: 5px;">
            <input type="text" id="ai-command-input" placeholder="Ask AI..." style="flex: 1; background: #111; border: 1px solid #444; color: white; padding: 5px; font-size: 12px;">
            <button id="send-ai-btn" style="background: var(--accent-blue); border: none; padding: 5px 10px; border-radius: 2px; cursor: pointer;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
